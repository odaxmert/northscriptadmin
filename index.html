<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthScript Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        dark: '#1e293b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-dark text-white shadow-md p-4 flex justify-between items-center z-10">
        <div class="flex items-center">
            <h1 class="text-xl font-bold"><i class="fa-solid fa-bolt mr-2 text-yellow-400"></i>NorthScript Panel</h1>
            <span id="modeBadge" class="ml-4 text-xs px-2 py-1 rounded font-semibold"></span>
        </div>
        <div id="headerButtons" class="flex items-center space-x-2"></div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar: Root Items -->
        <aside class="w-1/3 bg-white border-r border-gray-200 p-4 overflow-y-auto flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-gray-700">Kısayollar</h2>
                <button id="addRootBtn" onclick="openModal('create_root')" class="text-primary hover:text-blue-700"><i class="fa-solid fa-plus text-xl"></i></button>
            </div>
            <div id="sidebarList" class="space-y-2 flex-1">
                <p class="text-gray-500 text-sm text-center mt-10">Veri yükleniyor...</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="w-2/3 bg-gray-50 p-6 overflow-y-auto">
            <div id="mainHeader" class="hidden mb-6 border-b pb-4">
                <div class="flex justify-between items-end">
                    <div class="flex-1">
                        <!-- Breadcrumbs -->
                        <div id="breadcrumbContainer" class="text-xl flex items-center flex-wrap"></div>
                    </div>
                    <div id="headerActions" class="flex items-center space-x-3"></div>
                </div>
            </div>

            <div id="mainContentArea" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="col-span-full text-center text-gray-400 mt-20">
                    <i class="fa-solid fa-hand-pointer text-4xl mb-3"></i>
                    <p>Lütfen soldan bir kısayol öğesi seçin.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Unified Item Modal -->
    <div id="itemModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-96 shadow-xl">
            <h3 id="itemModalTitle" class="text-lg font-bold mb-4">Yeni Kısayol Öğesi</h3>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Tür</label>
                <select id="itemType" onchange="toggleItemTypeFields()" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary">
                    <option value="folder">Klasör (Altına metinler/klasörler eklenir)</option>
                    <option value="script">Doğrudan Metin (Direkt yazdırılır)</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">İsim / Başlık</label>
                <input type="text" id="itemName" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary">
            </div>

            <div id="itemHotkeyContainer" class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Kısayol Tuşu</label>
                <select id="itemHotkey" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary font-mono"></select>
            </div>

            <div id="itemContentContainer" class="mb-4 hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Metin İçeriği</label>
                <textarea id="itemContent" rows="4" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary" placeholder="Yazdırılacak metin..."></textarea>
            </div>

            <div class="flex justify-end space-x-2">
                <button onclick="closeModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">İptal</button>
                <button onclick="saveModalItem()" class="px-4 py-2 bg-primary text-white rounded hover:bg-blue-600">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Move Item Modal -->
    <div id="moveModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-[32rem] max-h-[85vh] shadow-xl flex flex-col">
            <h3 class="text-lg font-bold mb-1">Öğeyi Taşı</h3>
            <p id="moveSourceLabel" class="text-sm text-gray-500 mb-4"></p>

            <label class="block text-sm font-medium text-gray-700 mb-1">Hedef Konum</label>
            <div id="moveTree" class="border border-gray-300 rounded p-2 mb-4 bg-gray-50 overflow-y-auto flex-1 min-h-[8rem]"></div>

            <div id="moveHotkeyContainer" class="mb-4 hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Kısayol Tuşu (ana seviye için zorunlu)</label>
                <select id="moveHotkey" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary font-mono"></select>
            </div>

            <div class="flex justify-end space-x-2">
                <button onclick="closeMoveModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">İptal</button>
                <button onclick="confirmMove()" class="px-4 py-2 bg-primary text-white rounded hover:bg-blue-600"><i class="fa-solid fa-arrow-right-arrow-left mr-2"></i>Taşı</button>
            </div>
        </div>
    </div>

    <script>
        const PREDEFINED_HOTKEYS = [
            "<ctrl>+q", "<ctrl>+w", "<ctrl>+e", "<ctrl>+r", "<ctrl>+t", "<ctrl>+y", "<ctrl>+u", "<ctrl>+i", "<ctrl>+o", "<ctrl>+p",
            "<ctrl>+a", "<ctrl>+s", "<ctrl>+d", "<ctrl>+f", "<ctrl>+g", "<ctrl>+h", "<ctrl>+j", "<ctrl>+k", "<ctrl>+l",
            "<ctrl>+z", "<ctrl>+x", "<ctrl>+c", "<ctrl>+v", "<ctrl>+b", "<ctrl>+n", "<ctrl>+m",
            "<alt>+q", "<alt>+w", "<alt>+e", "<alt>+r", "<alt>+t", "<alt>+y", "<alt>+u", "<alt>+i", "<alt>+o", "<alt>+p",
            "<alt>+a", "<alt>+s", "<alt>+d", "<alt>+f", "<alt>+g", "<alt>+h", "<alt>+j", "<alt>+k", "<alt>+l",
            "<alt>+z", "<alt>+x", "<alt>+c", "<alt>+v", "<alt>+b", "<alt>+n", "<alt>+m",
            "<ctrl>+<alt>+q", "<ctrl>+<alt>+w", "<ctrl>+<alt>+e", "<ctrl>+<alt>+1", "<ctrl>+<alt>+2", "<ctrl>+<alt>+3"
        ];

        // Exe'lerin okudugu dagitim kopyasi. Firebase kurallariyla kisitlandi:
        // sadece veri degistikten sonraki kisa pencerede okunabilir.
        const FIREBASE_URL = "https://northscript-a0702-default-rtdb.firebaseio.com/data.json";

        // Panelin okudugu yonetim kopyasi. Okumasi her zaman aciktir; boylece
        // dagitim kopyasi kapaliyken de panel calisir.
        const ADMIN_URL = "https://northscript-a0702-default-rtdb.firebaseio.com/admin.json";

        const DRAFT_KEY = 'northscript_draft_v1::' + FIREBASE_URL;

        let appData = { items: {} };
        let currentPath = [];
        let modalMode = 'create_root';
        let modalTargetPath = [];

        // --- Edit session state ---
        let isEditing = false;       // true iken degisiklikler sadece tarayicida tutulur
        let pendingChanges = 0;      // yayinlanmamis degisiklik sayisi
        let baseRev = 0;             // duzenlemeye baslarken sunucudaki surum numarasi

        function generateId() { return Math.random().toString(36).substr(2, 9); }

        // Kullanici metinleri HTML olarak degil, duz metin olarak gosterilmeli.
        // (Bir script icerigi "<div>" gibi bir sey icerdiginde paneli bozmasin.)
        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        function migrateToRecursive(obj) {
            if (!obj) return;
            for (const key in obj) {
                const item = obj[key];
                if (item.type === 'folder' && item.scripts) {
                    item.children = item.scripts;
                    delete item.scripts;
                    for (const childKey in item.children) {
                        item.children[childKey].type = 'script';
                    }
                }
                if (item.children) migrateToRecursive(item.children);
            }
        }

        // ---------------------------------------------------------------
        // Veri okuma / yazma
        // ---------------------------------------------------------------
        async function fetchJson(url) {
            const res = await fetch(url, { cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return (await res.json()) || {};
        }

        async function putJson(url, payload) {
            const res = await fetch(url, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) {
                if (res.status === 429) throw new Error('Çok fazla istek yapıldı (Rate Limit). Lütfen 1 dakika bekleyip tekrar deneyin.');
                if (res.status === 401) throw new Error('Yazma izni reddedildi. Firebase kurallarını kontrol edin.');
                throw new Error(`HTTP Hata: ${res.status}`);
            }
        }

        // Panel her zaman yonetim kopyasini okur.
        // Ilk kurulumda /admin henuz olusmamistir; o tek seferde eski /data
        // yolundan devralinir ve ilk yayinla birlikte iki yol da dolar.
        async function fetchRemote() {
            const admin = await fetchJson(ADMIN_URL);
            if (admin && admin.items) return admin;

            let legacyError = null;
            try {
                const legacy = await fetchJson(FIREBASE_URL);
                if (legacy && legacy.items) return legacy;
            } catch (e) {
                legacyError = e;
            }

            // Iki kaynaktan da veri gelmedi. Sessizce bos donersek kullanici
            // bos veriyi yayinlayip tum kisayollari silebilir; bu yuzden hata veriyoruz.
            if (legacyError) {
                throw new Error(
                    'Veri okunamadı. Yönetim kopyası (/admin) henüz oluşmamış ve ' +
                    'dağıtım kopyası (/data) kurallar tarafından kapatılmış görünüyor.\n\n' +
                    'Çözüm: Firebase kurallarında /data okumasını geçici olarak açın, ' +
                    'panelden bir kez yayın yapın, sonra kuralları geri koyun.\n\n' +
                    'Ayrıntı: ' + legacyError.message
                );
            }
            return admin;
        }

        async function loadData({ silent = false } = {}) {
            if (isEditing && pendingChanges > 0 && !silent) {
                if (!confirm('Yayınlanmamış değişiklikleriniz var. Sunucudan yeniden yüklerseniz bunlar kaybolur. Devam edilsin mi?')) return;
                discardDraft();
            }
            try {
                const data = await fetchRemote();
                appData = data;
                if (!appData.items) appData.items = {};
                migrateToRecursive(appData.items);
                baseRev = Number(appData.meta?.rev) || 0;

                isEditing = false;
                pendingChanges = 0;
                renderAll();
            } catch (e) {
                alert("Veri çekilirken hata oluştu: " + e.message);
            }
        }

        // ---------------------------------------------------------------
        // Düzenleme oturumu
        // ---------------------------------------------------------------
        function readDraft() {
            try {
                const raw = localStorage.getItem(DRAFT_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch { return null; }
        }

        function saveDraft() {
            try {
                localStorage.setItem(DRAFT_KEY, JSON.stringify({
                    baseRev,
                    pendingChanges,
                    items: appData.items,
                    savedAt: new Date().toISOString()
                }));
            } catch (e) {
                console.warn('Taslak kaydedilemedi:', e);
            }
        }

        function discardDraft() {
            try { localStorage.removeItem(DRAFT_KEY); } catch {}
            pendingChanges = 0;
        }

        function markDirty() {
            pendingChanges += 1;
            saveDraft();
            renderHeaderButtons();
        }

        function startEditing() {
            const draft = readDraft();
            if (draft && draft.items) {
                const when = draft.savedAt ? new Date(draft.savedAt).toLocaleString('tr-TR') : 'bilinmiyor';
                if (confirm(`Yayınlanmamış bir taslak bulundu (${when}).\nDevam etmek için "Tamam", sıfırdan başlamak için "İptal".`)) {
                    appData.items = draft.items;
                    pendingChanges = Number(draft.pendingChanges) || 1;
                } else {
                    discardDraft();
                }
            }
            isEditing = true;
            renderAll();
        }

        function cancelEditing() {
            if (pendingChanges > 0 && !confirm(`${pendingChanges} yayınlanmamış değişiklik silinecek. Emin misiniz?`)) return;
            discardDraft();
            loadData({ silent: true });
        }

        async function publishChanges() {
            if (pendingChanges === 0) {
                isEditing = false;
                renderAll();
                return;
            }

            // Son emniyet: bos veri yayinlamak tum bilgisayarlardaki kisayollari siler.
            if (!appData.items || Object.keys(appData.items).length === 0) {
                if (!confirm('DİKKAT: Yayınlanacak veri BOŞ.\n\nBu işlem tüm bilgisayarlardaki kısayolları siler. Gerçekten devam edilsin mi?')) return;
            }

            let remote = null;
            try {
                remote = await fetchRemote();
            } catch (e) {
                return alert('Sunucu sürümü kontrol edilemedi, yayınlama iptal edildi.\nNedeni: ' + e.message);
            }

            const remoteRev = Number(remote?.meta?.rev) || 0;
            if (remoteRev !== baseRev) {
                const proceed = confirm(
                    'DİKKAT: Siz düzenlerken veriler başka bir yerden değiştirilmiş.\n' +
                    `(Sizin başlangıç sürümünüz: ${baseRev}, sunucudaki: ${remoteRev})\n\n` +
                    '"Tamam" derseniz sizin sürümünüz diğerinin üzerine yazılır.\n' +
                    '"İptal" derseniz hiçbir şey değişmez ve taslağınız korunur.'
                );
                if (!proceed) return;
            }

            const nextRev = Math.max(baseRev, remoteRev) + 1;
            const payload = {
                ...appData,
                meta: {
                    rev: nextRev,
                    updatedAt: new Date().toISOString(),
                    // Sunucu saati. Firebase kurallari okuma penceresini bu damgaya
                    // gore actigi icin tarayici saatine guvenilmez.
                    updatedAtMs: { '.sv': 'timestamp' }
                }
            };

            try {
                // Once yonetim kopyasi, sonra dagitim kopyasi.
                // Dagitim kopyasi en sona birakilir: okuma penceresi ancak veri
                // eksiksiz yazildiktan sonra acilsin.
                await putJson(ADMIN_URL, payload);
                await putJson(FIREBASE_URL, payload);
            } catch (e) {
                return alert("Yayınlanamadı! Taslağınız korundu.\nNedeni: " + e.message);
            }

            // Sunucu damgasi yerel kopyada sentinel olarak kalmasin.
            appData = { ...payload, meta: { ...payload.meta, updatedAtMs: Date.now() } };
            baseRev = nextRev;
            discardDraft();
            isEditing = false;
            renderAll();
            alert('Yayınlandı. Tüm bilgisayarlar en geç 1 dakika içinde güncellenecek.');
        }

        function requireEditMode() {
            if (isEditing) return true;
            alert('Değişiklik yapmak için önce üst bardaki "DÜZENLEMEYE BAŞLA" butonuna basın.');
            return false;
        }

        window.addEventListener('beforeunload', (e) => {
            if (pendingChanges > 0) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        // ---------------------------------------------------------------
        // Render
        // ---------------------------------------------------------------
        function renderAll() {
            renderHeaderButtons();
            renderSidebar();
            renderMainArea();
        }

        function renderHeaderButtons() {
            const badge = document.getElementById('modeBadge');
            const buttons = document.getElementById('headerButtons');
            const addRootBtn = document.getElementById('addRootBtn');

            addRootBtn.classList.toggle('hidden', !isEditing);

            if (isEditing) {
                badge.className = 'ml-4 text-xs px-2 py-1 rounded font-semibold bg-amber-400 text-amber-900';
                badge.innerText = pendingChanges > 0
                    ? `DÜZENLEME MODU — ${pendingChanges} yayınlanmamış değişiklik`
                    : 'DÜZENLEME MODU';

                buttons.innerHTML = `
                    <button onclick="cancelEditing()" class="bg-gray-600 hover:bg-gray-500 text-white px-4 py-2 rounded transition"><i class="fa-solid fa-xmark mr-2"></i>İptal</button>
                    <button onclick="publishChanges()" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded transition font-semibold"><i class="fa-solid fa-cloud-arrow-up mr-2"></i>KAYDET VE YAYINLA</button>
                `;
            } else {
                badge.className = 'ml-4 text-xs px-2 py-1 rounded font-semibold bg-slate-600 text-slate-200';
                badge.innerText = `Görüntüleme — sürüm ${baseRev}`;

                buttons.innerHTML = `
                    <button onclick="loadData()" class="bg-slate-600 hover:bg-slate-500 text-white px-4 py-2 rounded transition"><i class="fa-solid fa-sync mr-2"></i>Yenile</button>
                    <button onclick="startEditing()" class="bg-primary hover:bg-blue-600 text-white px-4 py-2 rounded transition font-semibold"><i class="fa-solid fa-pen-to-square mr-2"></i>DÜZENLEMEYE BAŞLA</button>
                `;
            }
        }

        function getItemAt(pathArray) {
            let container = appData.items;
            let item = null;
            for (let i = 0; i < pathArray.length; i++) {
                item = container[pathArray[i]];
                if (!item) return null;
                container = item.children || {};
            }
            return item;
        }

        function getParentContainer(pathArray) {
            if (pathArray.length <= 1) return appData.items;
            const parentItem = getItemAt(pathArray.slice(0, -1));
            return parentItem ? parentItem.children : appData.items;
        }

        function renderSidebar() {
            const list = document.getElementById('sidebarList');
            list.innerHTML = '';
            const items = appData.items || {};

            if (Object.keys(items).length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-sm text-center mt-10">Henüz kısayol yok.</p>';
                return;
            }

            const groups = {};
            for (const [id, item] of Object.entries(items)) {
                const hk = item.hotkey || 'Atanmadı';
                if (!groups[hk]) groups[hk] = {};
                groups[hk][id] = item;
            }

            for (const [hk, groupItems] of Object.entries(groups)) {
                list.innerHTML += `<div class="text-xs font-bold text-gray-400 mt-4 mb-2 uppercase tracking-wide border-b pb-1"><i class="fa-solid fa-keyboard mr-1"></i> ${esc(hk)}</div>`;
                for (const [id, item] of Object.entries(groupItems)) {
                    const isSelected = currentPath.length > 0 && currentPath[0] === id;
                    const activeClass = isSelected ? 'bg-blue-50 border-blue-500 border-l-4' : 'hover:bg-gray-50 border-l-4 border-transparent';
                    const icon = item.type === 'folder' ? '<i class="fa-solid fa-folder text-yellow-500 mr-2"></i>' : '<i class="fa-solid fa-file-lines text-green-500 mr-2"></i>';

                    const moveBtn = isEditing
                        ? `<button onclick="event.stopPropagation(); openMoveModal(['${id}'])" title="Taşı" class="text-gray-400 hover:text-primary px-1 shrink-0"><i class="fa-solid fa-arrow-right-arrow-left"></i></button>`
                        : '';

                    list.innerHTML += `
                        <div onclick="selectRootItem('${id}')" class="cursor-pointer p-2 rounded shadow-sm bg-white ${activeClass} transition mb-1">
                            <div class="font-bold text-gray-800 text-sm flex items-center justify-between">
                                <span class="flex items-center min-w-0">${icon}<span class="truncate">${esc(item.name)}</span></span>
                                ${moveBtn}
                            </div>
                        </div>
                    `;
                }
            }
        }

        function selectRootItem(id) {
            currentPath = [id];
            renderSidebar();
            renderMainArea();
        }

        function goBack(index) {
            currentPath = currentPath.slice(0, index + 1);
            renderMainArea();
        }

        function enterFolder(id) {
            currentPath.push(id);
            renderMainArea();
        }

        function renderMainArea() {
            const header = document.getElementById('mainHeader');
            const contentArea = document.getElementById('mainContentArea');

            if (currentPath.length === 0) {
                header.classList.add('hidden');
                contentArea.innerHTML = `
                    <div class="col-span-full text-center text-gray-400 mt-20">
                        <i class="fa-solid fa-hand-pointer text-4xl mb-3"></i>
                        <p>Lütfen soldan bir kısayol öğesi seçin.</p>
                    </div>`;
                return;
            }

            header.classList.remove('hidden');

            let breadcrumbHtml = `<span class="cursor-pointer text-blue-500 hover:underline" onclick="currentPath=[]; renderSidebar(); renderMainArea();"><i class="fa-solid fa-home"></i></span> <span class="mx-2 text-gray-400">/</span> `;
            let currentItem = null;

            for (let i = 0; i < currentPath.length; i++) {
                currentItem = getItemAt(currentPath.slice(0, i + 1));
                if (!currentItem) { currentPath = []; renderSidebar(); renderMainArea(); return; }

                const icon = currentItem.type === 'folder' ? '<i class="fa-solid fa-folder text-yellow-500 mr-1 text-base"></i>' : '<i class="fa-solid fa-file-lines text-green-500 mr-1 text-base"></i>';

                if (i === currentPath.length - 1) {
                    breadcrumbHtml += `<span class="font-bold text-gray-800 flex items-center">${icon}${esc(currentItem.name)}</span>`;
                } else {
                    breadcrumbHtml += `<span class="cursor-pointer text-blue-500 hover:underline flex items-center" onclick="goBack(${i})">${icon}${esc(currentItem.name)}</span> <span class="mx-2 text-gray-400">/</span> `;
                }
            }

            document.getElementById('breadcrumbContainer').innerHTML = breadcrumbHtml;

            const isRoot = currentPath.length === 1;
            const pathArgs = currentPath.map(p => `'${p}'`).join(',');
            const hkBadge = isRoot ? `<span class="text-sm bg-gray-200 px-2 py-1 rounded font-mono"><i class="fa-solid fa-keyboard mr-1"></i>${esc(currentItem.hotkey || '')}</span>` : '';

            let actionsHtml = hkBadge;
            if (isEditing) {
                const addBtn = currentItem.type === 'folder'
                    ? `<button onclick="openModal('create_child', [${pathArgs}])" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 text-sm rounded shadow transition"><i class="fa-solid fa-plus mr-1"></i>Yeni Ekle</button>`
                    : '';
                actionsHtml += `
                    <button onclick="openModal('edit', [${pathArgs}])" title="Düzenle" class="text-gray-500 hover:text-gray-800"><i class="fa-solid fa-edit"></i></button>
                    <button onclick="openMoveModal([${pathArgs}])" title="Taşı" class="text-gray-500 hover:text-primary"><i class="fa-solid fa-arrow-right-arrow-left"></i></button>
                    <button onclick="deleteItemAction([${pathArgs}])" title="Sil" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                    ${addBtn}
                `;
            }
            document.getElementById('headerActions').innerHTML = actionsHtml;

            contentArea.innerHTML = '';

            if (currentItem.type === 'script') {
                contentArea.innerHTML = `
                    <div class="col-span-full bg-white p-6 rounded-lg shadow-sm border border-gray-100">
                        <h3 class="text-lg font-bold mb-4 text-gray-700 border-b pb-2">Metin İçeriği</h3>
                        <p class="text-gray-800 whitespace-pre-wrap">${esc(currentItem.content || '')}</p>
                    </div>`;
                return;
            }

            const children = currentItem.children || {};
            if (Object.keys(children).length === 0) {
                contentArea.innerHTML = '<div class="col-span-full text-center text-gray-400 py-10">Bu klasör boş.</div>';
                return;
            }

            for (const [cid, child] of Object.entries(children)) {
                const isFolder = child.type === 'folder';
                const icon = isFolder ? '<i class="fa-solid fa-folder text-yellow-500 text-lg"></i>' : '<i class="fa-solid fa-file-lines text-green-500 text-lg"></i>';
                const childArgs = [...currentPath, cid].map(p => `'${p}'`).join(',');

                const childActions = isEditing ? `
                    <div class="space-x-3 text-sm shrink-0">
                        <button onclick="openModal('edit', [${childArgs}])" title="Düzenle" class="text-gray-400 hover:text-blue-500"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="openMoveModal([${childArgs}])" title="Taşı" class="text-gray-400 hover:text-primary"><i class="fa-solid fa-arrow-right-arrow-left"></i></button>
                        <button onclick="deleteItemAction([${childArgs}])" title="Sil" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                    </div>` : '';

                contentArea.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow border border-gray-100 flex flex-col justify-between hover:shadow-md transition">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-gray-800 flex items-center space-x-2"><span>${icon}</span> <span>${esc(child.name)}</span></h4>
                                ${childActions}
                            </div>
                            ${isFolder ?
                                `<button onclick="enterFolder('${cid}')" class="mt-3 w-full bg-blue-50 hover:bg-blue-100 text-blue-600 py-2 rounded text-sm transition font-semibold"><i class="fa-solid fa-folder-open mr-2"></i>İçine Gir</button>` :
                                `<p class="text-sm text-gray-600 whitespace-pre-wrap line-clamp-3 mt-2 bg-gray-50 p-2 rounded">${esc(child.content)}</p>`}
                        </div>
                    </div>
                `;
            }
        }

        // --- Modals ---
        function populateHotkeys(selectElement, selectedValue) {
            selectElement.innerHTML = '<option value="">-- Kısayol Seçin --</option>';
            PREDEFINED_HOTKEYS.forEach(hk => {
                const opt = document.createElement('option');
                opt.value = hk; opt.innerText = hk;
                if (hk === selectedValue) opt.selected = true;
                selectElement.appendChild(opt);
            });
        }

        function toggleItemTypeFields() {
            const type = document.getElementById('itemType').value;
            if (type === 'script') {
                document.getElementById('itemContentContainer').classList.remove('hidden');
            } else {
                document.getElementById('itemContentContainer').classList.add('hidden');
            }
        }

        function openModal(mode, pathArray = []) {
            if (!requireEditMode()) return;

            modalMode = mode;
            modalTargetPath = pathArray;

            const hkContainer = document.getElementById('itemHotkeyContainer');
            const typeSelect = document.getElementById('itemType');
            const hkSelect = document.getElementById('itemHotkey');
            const title = document.getElementById('itemModalTitle');

            document.getElementById('itemName').value = '';
            document.getElementById('itemContent').value = '';

            if (mode === 'create_root') {
                hkContainer.classList.remove('hidden');
                typeSelect.disabled = false; typeSelect.value = 'folder';
                title.innerText = 'Yeni Ana Kısayol Öğesi';
                populateHotkeys(hkSelect, '');
            } else if (mode === 'create_child') {
                hkContainer.classList.add('hidden');
                typeSelect.disabled = false; typeSelect.value = 'script';
                title.innerText = 'Yeni Alt Öğe';
            } else if (mode === 'edit') {
                const item = getItemAt(pathArray);
                const isRoot = pathArray.length === 1;

                if (isRoot) {
                    hkContainer.classList.remove('hidden');
                    populateHotkeys(hkSelect, item.hotkey || '');
                } else {
                    hkContainer.classList.add('hidden');
                }

                typeSelect.value = item.type || 'folder';
                typeSelect.disabled = true; // Cannot change type after creation
                document.getElementById('itemName').value = item.name;
                document.getElementById('itemContent').value = item.content || '';
                title.innerText = 'Öğeyi Düzenle';
            }

            toggleItemTypeFields();
            document.getElementById('itemModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('itemModal').classList.add('hidden'); }

        function saveModalItem() {
            if (!requireEditMode()) return;

            const type = document.getElementById('itemType').value;
            const name = document.getElementById('itemName').value.trim();
            const content = document.getElementById('itemContent').value.trim();

            if (!name) return alert('İsim boş olamaz.');
            if (type === 'script' && !content) return alert('Metin içeriği boş olamaz.');

            let isRoot = false;
            let itemObj = null;

            if (modalMode === 'edit') {
                itemObj = getItemAt(modalTargetPath);
                itemObj.name = name;
                if (type === 'script') itemObj.content = content;
                isRoot = modalTargetPath.length === 1;
            } else {
                itemObj = { type: type, name: name };
                if (type === 'folder') itemObj.children = {};
                if (type === 'script') itemObj.content = content;

                const newId = 'item_' + generateId();
                if (modalMode === 'create_root') {
                    appData.items[newId] = itemObj;
                    isRoot = true;
                    // Auto select the new root item
                    currentPath = [newId];
                } else if (modalMode === 'create_child') {
                    const parent = getItemAt(modalTargetPath);
                    if (!parent.children) parent.children = {};
                    parent.children[newId] = itemObj;
                }
            }

            if (isRoot) {
                const hotkey = document.getElementById('itemHotkey').value;
                if (!hotkey) return alert('Ana öğeler için kısayol seçmelisiniz.');
                itemObj.hotkey = hotkey;
            }

            markDirty();
            closeModal();
            renderSidebar();
            renderMainArea();
        }

        function deleteItemAction(pathArray) {
            if (!requireEditMode()) return;

            if (confirm('Bu öğeyi (ve varsa içindeki tüm alt klasör/metinleri) silmek istediğinize emin misiniz?')) {
                const container = getParentContainer(pathArray);
                const id = pathArray[pathArray.length - 1];
                delete container[id];

                // If we deleted an ancestor of what we are viewing, go back to root
                let viewingDeleted = false;
                for(let i=0; i<pathArray.length; i++) {
                    if(pathArray[i] === currentPath[i] && i === pathArray.length - 1) {
                        viewingDeleted = true;
                    }
                }

                if (viewingDeleted) {
                    currentPath = currentPath.slice(0, pathArray.length - 1);
                }

                markDirty();
                renderSidebar();
                renderMainArea();
            }
        }

        // ---------------------------------------------------------------
        // Tasima (move)
        // ---------------------------------------------------------------
        let moveSourcePath = [];
        let moveTargetPath = null;   // null = henuz secilmedi, [] = ana seviye
        let moveTreeNodes = [];      // onclick'te tirnak kacisi derdi olmasin diye indeksli erisim

        function isSamePath(a, b) {
            return Array.isArray(a) && Array.isArray(b) && a.length === b.length && a.every((v, i) => v === b[i]);
        }

        // Hedef, kaynagin kendisi mi ya da onun icinde mi?
        // (Bir klasoru kendi altina tasimak agaci kopariri; bunu engelliyoruz.)
        function isInsidePath(target, source) {
            if (target.length < source.length) return false;
            return source.every((v, i) => target[i] === v);
        }

        function openMoveModal(pathArray) {
            if (!requireEditMode()) return;

            const item = getItemAt(pathArray);
            if (!item) return;

            moveSourcePath = pathArray;
            moveTargetPath = null;

            const kind = item.type === 'folder' ? 'Klasör' : 'Metin';
            document.getElementById('moveSourceLabel').innerText = `${kind}: ${item.name}`;
            populateHotkeys(document.getElementById('moveHotkey'), item.hotkey || '');

            renderMoveTree();
            document.getElementById('moveModal').classList.remove('hidden');
        }

        function closeMoveModal() {
            document.getElementById('moveModal').classList.add('hidden');
            moveTargetPath = null;
        }

        function moveRowHtml(labelHtml, path, depth) {
            const index = moveTreeNodes.length;
            moveTreeNodes.push(path);

            const isSelf = path.length > 0 && isInsidePath(path, moveSourcePath);
            const isCurrentParent = isSamePath(path, moveSourcePath.slice(0, -1));
            const disabled = isSelf || isCurrentParent;
            const selected = moveTargetPath !== null && isSamePath(path, moveTargetPath);

            let cls = 'flex items-center px-2 py-1.5 rounded text-sm transition ';
            let note = '';
            if (disabled) {
                cls += 'text-gray-400 cursor-not-allowed';
                note = isCurrentParent
                    ? '<span class="ml-2 text-xs italic">(mevcut konum)</span>'
                    : '<span class="ml-2 text-xs italic">(kendi içine taşınamaz)</span>';
            } else if (selected) {
                cls += 'bg-primary text-white cursor-pointer font-semibold';
            } else {
                cls += 'hover:bg-blue-50 cursor-pointer';
            }

            const handler = disabled ? '' : `onclick="selectMoveTarget(${index})"`;
            return `<div ${handler} class="${cls}" style="margin-left:${depth * 18}px">${labelHtml}${note}</div>`;
        }

        function moveTreeRows(container, parentPath, depth) {
            let html = '';
            for (const [id, item] of Object.entries(container || {})) {
                if (item.type !== 'folder') continue;   // Sadece klasorlerin icine tasinabilir
                const path = [...parentPath, id];
                html += moveRowHtml(`<i class="fa-solid fa-folder text-yellow-500 mr-2"></i>${esc(item.name)}`, path, depth);
                html += moveTreeRows(item.children, path, depth + 1);
            }
            return html;
        }

        function renderMoveTree() {
            moveTreeNodes = [];
            let html = moveRowHtml('<i class="fa-solid fa-house text-blue-500 mr-2"></i>Ana Seviye', [], 0);
            html += moveTreeRows(appData.items, [], 1);
            document.getElementById('moveTree').innerHTML = html;

            // Ana seviyedeki her ogenin bir kisayolu olmak zorunda.
            const needsHotkey = moveTargetPath !== null && moveTargetPath.length === 0;
            document.getElementById('moveHotkeyContainer').classList.toggle('hidden', !needsHotkey);
        }

        function selectMoveTarget(index) {
            moveTargetPath = moveTreeNodes[index];
            renderMoveTree();
        }

        function confirmMove() {
            if (!requireEditMode()) return;
            if (moveTargetPath === null) return alert('Lütfen bir hedef konum seçin.');
            if (isInsidePath(moveTargetPath, moveSourcePath)) return alert('Bir klasör kendi içine taşınamaz.');

            const toRoot = moveTargetPath.length === 0;

            let hotkey = '';
            if (toRoot) {
                hotkey = document.getElementById('moveHotkey').value;
                if (!hotkey) return alert('Ana seviyedeki öğeler için kısayol seçmelisiniz.');
            }

            // Kaynak ve hedef, silme isleminden ONCE cozulmeli.
            const id = moveSourcePath[moveSourcePath.length - 1];
            const srcContainer = getParentContainer(moveSourcePath);
            const item = srcContainer ? srcContainer[id] : null;
            if (!item) return alert('Taşınacak öğe bulunamadı.');

            let destContainer;
            if (toRoot) {
                destContainer = appData.items;
            } else {
                const destItem = getItemAt(moveTargetPath);
                if (!destItem || destItem.type !== 'folder') return alert('Hedef klasör bulunamadı.');
                if (!destItem.children) destItem.children = {};
                destContainer = destItem.children;
            }

            delete srcContainer[id];

            // Kimlikler rastgele, yine de teorik cakismaya karsi guvence.
            let newId = id;
            while (destContainer[newId]) newId = 'item_' + generateId();

            // Kisayol sadece ana seviyede anlamli.
            if (toRoot) item.hotkey = hotkey;
            else delete item.hotkey;

            destContainer[newId] = item;
            currentPath = [...moveTargetPath, newId];

            markDirty();
            closeMoveModal();
            renderSidebar();
            renderMainArea();
        }

        window.onload = () => loadData({ silent: true });
    </script>
</body>
</html>
