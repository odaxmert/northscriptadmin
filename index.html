<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthScript Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        dark: '#1e293b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-dark text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold"><i class="fa-solid fa-bolt mr-2 text-yellow-400"></i>NorthScript Panel</h1>
        <div>
            <button onclick="fetchData()" class="bg-primary hover:bg-blue-600 text-white px-4 py-2 rounded mr-2 transition"><i class="fa-solid fa-sync mr-2"></i>Yenile</button>
            <button onclick="openSettings()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded transition"><i class="fa-solid fa-cog mr-2"></i>Ayarlar</button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar: Items -->
        <aside class="w-1/3 bg-white border-r border-gray-200 p-4 overflow-y-auto flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-gray-700">Kısayollar</h2>
                <button onclick="openItemModal()" class="text-primary hover:text-blue-700"><i class="fa-solid fa-plus text-xl"></i></button>
            </div>
            <div id="itemList" class="space-y-2 flex-1">
                <!-- Items will be injected here -->
                <p class="text-gray-500 text-sm text-center mt-10">Veri yükleniyor...</p>
            </div>
        </aside>

        <!-- Main Content: Scripts/Content -->
        <main class="w-2/3 bg-gray-50 p-6 overflow-y-auto">
            <div id="itemHeader" class="hidden mb-6 flex justify-between items-center border-b pb-4">
                <div>
                    <div class="flex items-center">
                        <span id="itemTypeBadge" class="text-xs text-white px-2 py-1 rounded mr-2">Tür</span>
                        <h2 id="currentItemName" class="text-2xl font-bold text-gray-800">Seçili Öğe</h2>
                    </div>
                    <p id="currentItemHotkey" class="text-sm text-gray-500 mt-2 font-mono bg-gray-200 inline-block px-2 py-1 rounded"></p>
                </div>
                <div>
                    <button onclick="editCurrentItem()" class="text-gray-500 hover:text-gray-800 mr-3"><i class="fa-solid fa-edit"></i></button>
                    <button onclick="deleteCurrentItem()" class="text-red-500 hover:text-red-700 mr-4"><i class="fa-solid fa-trash"></i></button>
                    <button id="addScriptBtn" onclick="openScriptModal()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded shadow transition hidden"><i class="fa-solid fa-plus mr-2"></i>Alt Metin Ekle</button>
                </div>
            </div>
            
            <div id="scriptList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Content will be injected here -->
                <div id="emptyScriptsMsg" class="col-span-full text-center text-gray-400 mt-20">
                    <i class="fa-solid fa-hand-pointer text-4xl mb-3"></i>
                    <p>Lütfen soldan bir kısayol öğesi seçin.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-96 shadow-xl">
            <h3 class="text-lg font-bold mb-4">Ayarlar</h3>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Firebase Realtime DB URL</label>
                <input type="text" id="firebaseUrl" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary" placeholder="https://projeniz.firebaseio.com">
                <p class="text-xs text-gray-500 mt-1">Sonunda slash (/) olmasa da olur.</p>
            </div>
            <div class="flex justify-end space-x-2">
                <button onclick="closeSettings()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">İptal</button>
                <button onclick="saveSettings()" class="px-4 py-2 bg-primary text-white rounded hover:bg-blue-600">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Item Modal (Folder or Standalone Script) -->
    <div id="itemModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-96 shadow-xl">
            <h3 id="itemModalTitle" class="text-lg font-bold mb-4">Yeni Kısayol Öğesi</h3>
            <input type="hidden" id="itemId">
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Tür</label>
                <select id="itemType" onchange="toggleItemTypeFields()" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary">
                    <option value="folder">Klasör (Altına metinler eklenir)</option>
                    <option value="script">Doğrudan Metin (Direkt yazdırılır)</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">İsim / Başlık</label>
                <input type="text" id="itemName" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Kısayol Tuşu</label>
                <select id="itemHotkey" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary font-mono">
                    <!-- Options injected by JS -->
                </select>
            </div>

            <div id="itemContentContainer" class="mb-4 hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Metin İçeriği</label>
                <textarea id="itemContent" rows="4" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary" placeholder="Yazdırılacak metin..."></textarea>
            </div>

            <div class="flex justify-end space-x-2">
                <button onclick="closeItemModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">İptal</button>
                <button onclick="saveItem()" class="px-4 py-2 bg-primary text-white rounded hover:bg-blue-600">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Script Modal (Inside Folder) -->
    <div id="scriptModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-[500px] shadow-xl">
            <h3 id="scriptModalTitle" class="text-lg font-bold mb-4">Yeni Alt Metin</h3>
            <input type="hidden" id="scriptId">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Başlık</label>
                <input type="text" id="scriptName" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Metin İçeriği</label>
                <textarea id="scriptContent" rows="5" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary" placeholder="Yazdırılacak metin..."></textarea>
            </div>
            <div class="flex justify-end space-x-2">
                <button onclick="closeScriptModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">İptal</button>
                <button onclick="saveScript()" class="px-4 py-2 bg-primary text-white rounded hover:bg-blue-600">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        const PREDEFINED_HOTKEYS = [
            "<ctrl>+q", "<ctrl>+w", "<ctrl>+e", "<ctrl>+r", "<ctrl>+t", "<ctrl>+y", "<ctrl>+u", "<ctrl>+i", "<ctrl>+o", "<ctrl>+p",
            "<ctrl>+a", "<ctrl>+s", "<ctrl>+d", "<ctrl>+f", "<ctrl>+g", "<ctrl>+h", "<ctrl>+j", "<ctrl>+k", "<ctrl>+l",
            "<ctrl>+z", "<ctrl>+x", "<ctrl>+c", "<ctrl>+v", "<ctrl>+b", "<ctrl>+n", "<ctrl>+m",
            "<alt>+q", "<alt>+w", "<alt>+e", "<alt>+r", "<alt>+t", "<alt>+y", "<alt>+u", "<alt>+i", "<alt>+o", "<alt>+p",
            "<alt>+a", "<alt>+s", "<alt>+d", "<alt>+f", "<alt>+g", "<alt>+h", "<alt>+j", "<alt>+k", "<alt>+l",
            "<alt>+z", "<alt>+x", "<alt>+c", "<alt>+v", "<alt>+b", "<alt>+n", "<alt>+m",
            "<ctrl>+<alt>+q", "<ctrl>+<alt>+w", "<ctrl>+<alt>+e", "<ctrl>+<alt>+1", "<ctrl>+<alt>+2", "<ctrl>+<alt>+3"
        ];

        const FIREBASE_URL = "https://jsonblob.com/api/jsonBlob/019fcc7d-b3e5-787f-899c-7fe07c64a4eb";
        
        let appData = { items: {} };
        let currentItemId = null;

        async function loadData() {
            try {
                const res = await fetch(FIREBASE_URL);
                if (!res.ok) throw new Error('Failed to fetch');
                const data = await res.json();
                appData = data || { items: {} };
                
                // Migrate old folders if they exist
                if (!appData.items && appData.folders) {
                    appData.items = {};
                    for (const [id, f] of Object.entries(appData.folders)) {
                        appData.items[id] = {
                            type: 'folder',
                            name: f.name,
                            hotkey: f.hotkey,
                            scripts: f.scripts || {}
                        };
                    }
                    delete appData.folders;
                    saveData();
                } else if (!appData.items) {
                    appData.items = {};
                }
                
                renderItems();
                if (currentItemId && appData.items[currentItemId]) {
                    selectItem(currentItemId);
                } else {
                    currentItemId = null;
                    document.getElementById('itemHeader').classList.add('hidden');
                }
            } catch (e) {
                console.error(e);
                alert("Veri çekilirken hata oluştu: " + e.message);
            }
        }

        async function saveData() {
            try {
                await fetch(FIREBASE_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(appData)
                });
            } catch (e) {
                alert("Veri kaydedilemedi!");
            }
        }

        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        // --- Render Functions ---
        function renderItems() {
            const list = document.getElementById('itemList');
            list.innerHTML = '';
            const items = appData.items || {};
            
            // Group by hotkey
            const groups = {};
            for (const [id, item] of Object.entries(items)) {
                const hk = item.hotkey || 'Atanmadı';
                if (!groups[hk]) groups[hk] = {};
                groups[hk][id] = item;
            }
            
            // Render groups
            for (const [hk, groupItems] of Object.entries(groups)) {
                list.innerHTML += `<div class="text-xs font-bold text-gray-400 mt-4 mb-2 uppercase tracking-wide border-b pb-1"><i class="fa-solid fa-keyboard mr-1"></i> ${hk}</div>`;
                
                for (const [id, item] of Object.entries(groupItems)) {
                    const isSelected = id === currentItemId;
                    const activeClass = isSelected ? 'bg-blue-50 border-blue-500 border-l-4' : 'hover:bg-gray-50 border-l-4 border-transparent';
                    const icon = item.type === 'folder' ? '<i class="fa-solid fa-folder text-yellow-500 mr-2"></i>' : '<i class="fa-solid fa-file-lines text-green-500 mr-2"></i>';
                    
                    list.innerHTML += `
                        <div onclick="selectItem('${id}')" class="cursor-pointer p-2 rounded shadow-sm bg-white ${activeClass} transition mb-1">
                            <div class="font-bold text-gray-800 text-sm flex items-center">${icon} ${item.name}</div>
                        </div>
                    `;
                }
            }
        }

        function selectItem(id) {
            currentItemId = id;
            renderItems();
            const item = appData.items[id];
            
            document.getElementById('itemHeader').classList.remove('hidden');
            document.getElementById('currentItemName').innerText = item.name;
            document.getElementById('currentItemHotkey').innerText = item.hotkey || 'Kısayol Atanmadı';
            
            const badge = document.getElementById('itemTypeBadge');
            if (item.type === 'folder') {
                badge.innerText = 'Klasör';
                badge.className = 'text-xs text-white px-2 py-1 rounded mr-2 bg-yellow-500';
                document.getElementById('addScriptBtn').classList.remove('hidden');
            } else {
                badge.innerText = 'Doğrudan Metin';
                badge.className = 'text-xs text-white px-2 py-1 rounded mr-2 bg-green-500';
                document.getElementById('addScriptBtn').classList.add('hidden');
            }
            
            const slist = document.getElementById('scriptList');
            slist.innerHTML = '';
            
            if (item.type === 'script') {
                slist.innerHTML = `
                    <div class="col-span-full bg-white p-6 rounded-lg shadow-sm border border-gray-100">
                        <h3 class="text-lg font-bold mb-4 text-gray-700 border-b pb-2">Metin İçeriği</h3>
                        <p class="text-gray-800 whitespace-pre-wrap">${item.content || ''}</p>
                    </div>
                `;
                return;
            }

            // Folder rendering
            const scripts = item.scripts || {};
            if (Object.keys(scripts).length === 0) {
                slist.innerHTML = '<div class="col-span-full text-center text-gray-400 py-10">Bu klasörde henüz alt metin yok.</div>';
                return;
            }

            for (const [sid, s] of Object.entries(scripts)) {
                slist.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow border border-gray-100 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-gray-800">${s.name}</h4>
                                <div class="space-x-2 text-sm">
                                    <button onclick="editScript('${sid}')" class="text-gray-400 hover:text-blue-500"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="deleteScript('${sid}')" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                            <p class="text-sm text-gray-600 whitespace-pre-wrap">${s.content}</p>
                        </div>
                    </div>
                `;
            }
        }

        // --- Initialization ---
        window.onload = () => {
            loadData();
        };

        // --- Item Modal ---
        function populateHotkeys(selectElement, selectedValue) {
            selectElement.innerHTML = '<option value="">-- Kısayol Seçin --</option>';
            
            PREDEFINED_HOTKEYS.forEach(hk => {
                const opt = document.createElement('option');
                opt.value = hk;
                opt.innerText = hk;
                if (hk === selectedValue) opt.selected = true;
                selectElement.appendChild(opt);
            });
        }

        function toggleItemTypeFields() {
            const type = document.getElementById('itemType').value;
            if (type === 'script') {
                document.getElementById('itemContentContainer').classList.remove('hidden');
            } else {
                document.getElementById('itemContentContainer').classList.add('hidden');
            }
        }

        function openItemModal(id = null) {
            const hotkeySelect = document.getElementById('itemHotkey');
            let currentHk = '';

            if (id) {
                const item = appData.items[id];
                document.getElementById('itemId').value = id;
                document.getElementById('itemType').value = item.type || 'folder';
                document.getElementById('itemName').value = item.name;
                document.getElementById('itemContent').value = item.content || '';
                currentHk = item.hotkey || '';
                document.getElementById('itemModalTitle').innerText = 'Kısayolu Düzenle';
                document.getElementById('itemType').disabled = true; // Prevent changing type after creation
            } else {
                document.getElementById('itemId').value = '';
                document.getElementById('itemType').value = 'folder';
                document.getElementById('itemType').disabled = false;
                document.getElementById('itemName').value = '';
                document.getElementById('itemContent').value = '';
                document.getElementById('itemModalTitle').innerText = 'Yeni Kısayol Öğesi';
            }
            
            populateHotkeys(hotkeySelect, currentHk);
            toggleItemTypeFields();
            document.getElementById('itemModal').classList.remove('hidden');
        }

        function closeItemModal() { document.getElementById('itemModal').classList.add('hidden'); }
        
        async function saveItem() {
            const id = document.getElementById('itemId').value || 'item_' + generateId();
            const type = document.getElementById('itemType').value;
            const name = document.getElementById('itemName').value.trim();
            const hotkey = document.getElementById('itemHotkey').value;
            const content = document.getElementById('itemContent').value.trim();
            
            if (!name) return alert('İsim boş olamaz.');
            if (!hotkey) return alert('Lütfen bir kısayol seçin.');
            if (type === 'script' && !content) return alert('Metin içeriği boş olamaz.');
            
            if (!appData.items[id]) {
                appData.items[id] = { type: type };
                if (type === 'folder') appData.items[id].scripts = {};
            }
            appData.items[id].name = name;
            appData.items[id].hotkey = hotkey;
            if (type === 'script') {
                appData.items[id].content = content;
            }
            
            await saveData();
            closeItemModal();
            fetchData();
        }

        function editCurrentItem() {
            if(currentItemId) openItemModal(currentItemId);
        }
        async function deleteCurrentItem() {
            if(!currentItemId) return;
            if(confirm('Bu öğeyi (ve varsa içindeki metinleri) silmek istediğinize emin misiniz?')) {
                delete appData.items[currentItemId];
                currentItemId = null;
                await saveData();
                fetchData();
            }
        }

        // --- Script Modal (For Folders) ---
        function openScriptModal(sid = null) {
            if (!currentItemId || appData.items[currentItemId].type !== 'folder') return;
            if (sid) {
                const s = appData.items[currentItemId].scripts[sid];
                document.getElementById('scriptId').value = sid;
                document.getElementById('scriptName').value = s.name;
                document.getElementById('scriptContent').value = s.content;
                document.getElementById('scriptModalTitle').innerText = 'Alt Metni Düzenle';
            } else {
                document.getElementById('scriptId').value = '';
                document.getElementById('scriptName').value = '';
                document.getElementById('scriptContent').value = '';
                document.getElementById('scriptModalTitle').innerText = 'Yeni Alt Metin';
            }
            document.getElementById('scriptModal').classList.remove('hidden');
        }
        
        function closeScriptModal() { document.getElementById('scriptModal').classList.add('hidden'); }
        
        async function saveScript() {
            if (!currentItemId || appData.items[currentItemId].type !== 'folder') return;
            const sid = document.getElementById('scriptId').value || 's_' + generateId();
            const name = document.getElementById('scriptName').value.trim();
            const content = document.getElementById('scriptContent').value.trim();
            
            if (!name || !content) return alert('Başlık ve metin içeriği boş olamaz.');
            
            if(!appData.items[currentItemId].scripts) {
                appData.items[currentItemId].scripts = {};
            }
            
            appData.items[currentItemId].scripts[sid] = {
                name: name,
                content: content
            };
            
            await saveData();
            closeScriptModal();
            fetchData();
        }

        function editScript(sid) { openScriptModal(sid); }
        async function deleteScript(sid) {
            if(confirm('Bu metni silmek istediğinize emin misiniz?')) {
                delete appData.items[currentItemId].scripts[sid];
                await saveData();
                fetchData();
            }
        }

        // Init
        window.onload = fetchData;
    </script>
</body>
</html>
